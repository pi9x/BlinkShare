name: blinkshare

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blinkshare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blinkshare"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - blinkshare-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - blinkshare-redis:/data

  object-storage:
    image: dxflrs/garage:v2.2.0
    environment:
      GARAGE_RPC_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    ports:
      - "9000:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - blinkshare-object-storage:/var/lib/garage

  object-storage-init:
    build:
      context: .
      dockerfile: tools/garage-bootstrap/Dockerfile
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_ACCESS_KEY_ID: GK0123456789abcdef01234567
      GARAGE_SECRET_ACCESS_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_BUCKET_NAME: blinkshare
      GARAGE_NODE_CAPACITY: 10G
    volumes:
      - ./deploy/garage/garage.toml:/etc/garage.toml:ro
      - blinkshare-object-storage:/var/lib/garage
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: src/backend/BlinkShare.Api/Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=blinkshare;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ObjectStorage__ServiceUrl: http://object-storage:9000
      ObjectStorage__PublicUrl: http://localhost:9000
      ObjectStorage__BucketName: blinkshare
      ObjectStorage__AccessKey: GK0123456789abcdef01234567
      ObjectStorage__SecretKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ObjectStorage__Region: garage
      ObjectStorage__ForcePathStyle: "true"
    command:
      - database
      - update
      - --project
      - /src/src/backend/BlinkShare.Api/BlinkShare.Api.csproj
      - --startup-project
      - /src/src/backend/BlinkShare.Api/BlinkShare.Api.csproj
      - --configuration
      - Release
      - --no-build
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/backend/BlinkShare.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=blinkshare;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ObjectStorage__ServiceUrl: http://object-storage:9000
      ObjectStorage__PublicUrl: http://localhost:9000
      ObjectStorage__BucketName: blinkshare
      ObjectStorage__AccessKey: GK0123456789abcdef01234567
      ObjectStorage__SecretKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ObjectStorage__Region: garage
      ObjectStorage__ForcePathStyle: "true"
    ports:
      - "5232:8080"

  worker:
    build:
      context: .
      dockerfile: src/backend/BlinkShare.Worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=blinkshare;Username=postgres;Password=postgres
      ObjectStorage__ServiceUrl: http://object-storage:9000
      ObjectStorage__PublicUrl: http://localhost:9000
      ObjectStorage__BucketName: blinkshare
      ObjectStorage__AccessKey: GK0123456789abcdef01234567
      ObjectStorage__SecretKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ObjectStorage__Region: garage
      ObjectStorage__ForcePathStyle: "true"

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    depends_on:
      api:
        condition: service_started
    environment:
      API_BASE_URL: ""
      APP_NAME: BlinkShare
      ANONYMOUS_MAX_FILE_SIZE_BYTES: 524288
      FREE_ACCOUNT_MAX_FILE_SIZE_BYTES: 1048576
    ports:
      - "4200:80"

volumes:
  blinkshare-postgres:
  blinkshare-redis:
  blinkshare-object-storage:
