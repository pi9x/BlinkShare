name: blinkshare

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blinkshare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blinkshare"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - blinkshare-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - blinkshare-redis:/data

  object-storage:
    build:
      context: .
      dockerfile: tools/object-storage-mock/Dockerfile
    ports:
      - "9000:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - blinkshare-object-storage:/data

  migrate:
    build:
      context: .
      dockerfile: src/backend/BlinkShare.Api/Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=blinkshare;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ObjectStorage__BaseUrl: http://localhost:9000
    command:
      - database
      - update
      - --project
      - /src/src/backend/BlinkShare.Api/BlinkShare.Api.csproj
      - --startup-project
      - /src/src/backend/BlinkShare.Api/BlinkShare.Api.csproj
      - --configuration
      - Release
      - --no-build
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/backend/BlinkShare.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=blinkshare;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ObjectStorage__BaseUrl: http://localhost:9000
    ports:
      - "5232:8080"

  worker:
    build:
      context: .
      dockerfile: src/backend/BlinkShare.Worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=blinkshare;Username=postgres;Password=postgres
      ObjectStorage__BaseUrl: http://localhost:9000

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "4200:80"

volumes:
  blinkshare-postgres:
  blinkshare-redis:
  blinkshare-object-storage:
