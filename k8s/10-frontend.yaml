apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: blinkshare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/pi9x/blinkshare-frontend:0.1.4
          envFrom:
            - configMapRef:
                name: blinkshare-config
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: blinkshare
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
